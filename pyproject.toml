[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runiverse-ai-server"
version = "0.1.0"
description = "Runiverse AI 음악 생성 요청 중계 서버 (Kafka ↔ SageMaker Async)"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4",
    "boto3>=1.34",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyMySQL[rsa]>=1.1",  # rsa: cryptography. MySQL 8.4 caching_sha2_password 첫 접속에 필요
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
