# dev에 머지되면 CI 통과 후 test AI 서버에 배포한다
#   이미지: GitHub Actions에서 빌드 → ECR (태그 = 커밋 12자)
#   배포: SSM Run Command로 AI 서버에서 deploy/test/server_deploy.sh 실행 (SSH·인바운드 포트 없음)
#
# 필요한 값 (GitHub → Settings → Environments → test → Environment secrets)
#   AWS_DEPLOY_ROLE_ARN    GitHub OIDC로 맡는 배포 역할
#   AI_SERVER_INSTANCE_ID  test AI 서버 EC2 인스턴스 ID
# 공개 저장소라 로그가 공개된다 → 계정 ID는 가리고, 서버 쪽 출력은 server_deploy.sh가 최소로 줄인다
name: Deploy test

on:
  push:
    branches: [dev]
  workflow_dispatch:  # 같은 커밋 다시 배포 (이전 실행 Re-run = 그 커밋으로 되돌리기)

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.repository == 'SWM-TeamBruteForce/runiverse-ai-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: test
    permissions:
      contents: read
      id-token: write  # OIDC
    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: runiverse-ai-server
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드·push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="${GITHUB_SHA::12}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "✅ 이미 있음 $TAG (태그 변경 불가 → 빌드 건너뜀)"
            exit 0
          fi
          docker build -q -t "$REGISTRY/$ECR_REPOSITORY:$TAG" . > /dev/null
          docker push -q "$REGISTRY/$ECR_REPOSITORY:$TAG" > /dev/null
          echo "✅ push $TAG"

      - name: 서버 배포 (SSM)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.AI_SERVER_INSTANCE_ID }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          params="$(jq -n --arg image "$IMAGE" --rawfile script deploy/test/server_deploy.sh '{
            executionTimeout: ["600"],
            commands: (["export IMAGE=" + ($image | @sh),
                        "cat > /tmp/ai-server-deploy.sh <<'"'"'DEPLOY'"'"'"]
                       + ($script | rtrimstr("\n") | split("\n"))
                       + ["DEPLOY", "bash /tmp/ai-server-deploy.sh"])}')"
          cmd_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "ai-server ${GITHUB_SHA::12}" --parameters "$params" \
            --query Command.CommandId --output text)"

          status=Pending
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "SSM 상태: $status"
          [ "$status" = Success ]
