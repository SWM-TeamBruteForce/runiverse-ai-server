# 단위 테스트 + MySQL 계약 테스트 + 이미지 빌드 확인. 비밀값을 쓰지 않는다 (포크 PR에서도 돈다)
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]  # dev push는 deploy-test.yml이 이 워크플로를 불러 돌린다
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:  # CI 전용 일회용 값 (러너 안에서만 쓰고 사라짐)
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: runiverse_ai_pytest
          MYSQL_USER: runiverse_ai
          MYSQL_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # cryptography: 비밀번호가 캐시되지 않은 새 MySQL 8.4에 PyMySQL이 접속할 때 필요 (caching_sha2_password)
      - run: pip install -e ".[dev]" cryptography
      - name: pytest
        env:
          PYTHONUTF8: "1"
          TEST_DATABASE_URL: mysql://runiverse_ai:ci-only@127.0.0.1:3306/runiverse_ai_pytest
        run: python -m pytest -q -rs

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -q -t runiverse-ai-server:ci .
